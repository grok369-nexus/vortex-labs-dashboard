name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit test server-side input validation
        run: node --test lib/contact-validation.test.mjs
      - name: Build
        run: npm run build
      - name: Test production security headers
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/secure-app-lab.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          headers_file=/tmp/secure-app-lab-headers.txt
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --dump-header "$headers_file" --output /dev/null http://127.0.0.1:3000/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/secure-app-lab.log
            echo "Production server did not become ready."
            exit 1
          fi
          require_header() {
            if ! grep --ignore-case --extended-regexp --quiet "^$1:[[:space:]]*$2[[:space:]]*\\r?$" "$headers_file"; then
              echo "Missing or incorrect response header: $1: $2"
              cat "$headers_file"
              exit 1
            fi
            echo "PASS: $1"
          }
          require_header "X-Content-Type-Options" "nosniff"
          require_header "X-Frame-Options" "DENY"
          require_header "Referrer-Policy" "strict-origin-when-cross-origin"
          require_header "Permissions-Policy" "camera=\\(\\), microphone=\\(\\), geolocation=\\(\\)"
          if ! grep --ignore-case --quiet "^Content-Security-Policy:" "$headers_file"; then
            echo "Missing Content-Security-Policy response header."
            cat "$headers_file"
            exit 1
          fi
          csp_line=$(grep --ignore-case "^Content-Security-Policy:" "$headers_file" | head -n 1)
          for directive in "default-src 'self'" "object-src 'none'" "base-uri 'self'" "frame-ancestors 'none'"; do
            if [[ "$csp_line" != *"$directive"* ]]; then
              echo "CSP is missing required directive: $directive"
              echo "$csp_line"
              exit 1
            fi
            echo "PASS: CSP $directive"
          done
          if grep --ignore-case --quiet "^X-Powered-By:" "$headers_file"; then
            echo "Unexpected X-Powered-By header is present."
            exit 1
          fi
          echo "PASS: X-Powered-By is not exposed"

          require_status() {
            actual="$1"
            expected="$2"
            name="$3"
            if [ "$actual" != "$expected" ]; then
              echo "FAIL: $name expected HTTP $expected, received HTTP $actual"
              cat /tmp/secure-app-lab-api-response.json
              exit 1
            fi
            echo "PASS: $name (HTTP $actual)"
          }
          valid_payload='{"name":"Ada Lovelace","email":"ada@example.com","message":"Please send me more information."}'
          status=$(curl --silent --output /tmp/secure-app-lab-api-response.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data "$valid_payload" http://127.0.0.1:3000/api/security/input-check)
          require_status "$status" "200" "Valid input is accepted"
          grep --quiet '"persisted":false' /tmp/secure-app-lab-api-response.json
          status=$(curl --silent --output /tmp/secure-app-lab-api-response.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{"name":"Ada Lovelace","message":"Please send me more information."}' http://127.0.0.1:3000/api/security/input-check)
          require_status "$status" "422" "Missing email is rejected"
          status=$(curl --silent --output /tmp/secure-app-lab-api-response.json --write-out '%{http_code}' --request POST --header 'Content-Type: text/plain' --data "$valid_payload" http://127.0.0.1:3000/api/security/input-check)
          require_status "$status" "415" "Unsupported content type is rejected"
          status=$(curl --silent --output /tmp/secure-app-lab-api-response.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{' http://127.0.0.1:3000/api/security/input-check)
          require_status "$status" "400" "Malformed JSON is rejected"
          large_payload=$(node -e 'process.stdout.write(JSON.stringify({name:"Ada Lovelace",email:"ada@example.com",message:"x".repeat(5000)}))')
          status=$(curl --silent --output /tmp/secure-app-lab-api-response.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data "$large_payload" http://127.0.0.1:3000/api/security/input-check)
          require_status "$status" "413" "Oversized request body is rejected"
